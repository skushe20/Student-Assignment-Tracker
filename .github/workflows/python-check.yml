name: Python Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-python:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check Python syntax
        run: python -m py_compile student_assignment_tracker.py
